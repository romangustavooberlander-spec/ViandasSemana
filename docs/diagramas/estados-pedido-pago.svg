<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="610px" preserveAspectRatio="none" style="width:1120px;height:610px;background:#FFFFFF;" version="1.1" viewBox="0 0 1120 610" width="1120px" zoomAndPan="magnify"><title>Estados de un pedido (Pedido.estado) y de su pago (Pago.estado)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="449.2441" x="328.6981" y="23.5625">Estados de un pedido (Pedido.estado) y de su pago (Pago.estado)</text><g id="PP"><rect fill="#F1F1F1" height="70.8184" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="239.6318" x="528.59" y="156.9395"/><line style="stroke:#181818;stroke-width:0.5;" x1="528.59" x2="768.2218" y1="217.7578" y2="217.7578"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="124.3184" x="538.59" y="175.502">PENDIENTE_PAGO</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.6318" x="538.59" y="192.4414">(pago: PENDIENTE, RECHAZADO</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.8975" x="538.59" y="209.3809">o CANCELADO)</text></g><g id="C"><rect fill="#F1F1F1" height="53.8789" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="149.541" x="122.59" y="320.9395"/><line style="stroke:#181818;stroke-width:0.5;" x1="122.59" x2="272.131" y1="364.8184" y2="364.8184"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="95.6279" x="132.59" y="339.502">CONFIRMADO</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="129.541" x="132.59" y="356.4414">(pago: APROBADO)</text></g><g id="X"><rect fill="#F1F1F1" height="53.8789" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="249.9951" x="319.59" y="467.9395"/><line style="stroke:#181818;stroke-width:0.5;" x1="319.59" x2="569.5851" y1="511.8184" y2="511.8184"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="87.459" x="329.59" y="486.502">CANCELADO</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.9951" x="329.59" y="503.4414">(pago: CANCELADO o DEVUELTO)</text></g><ellipse cx="648.59" cy="53.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="28.59" cy="593.9395" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="28.59" cy="593.9395" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start* to PP--><g class="link" data-entity-1="*start*" data-entity-2="PP" data-source-line="6" data-uid="lnk3" id="link_*start*_PP"><path d="M648.59,64.3195 C648.59,83.0495 648.59,119.9295 648.59,150.7095" fill="none" id="*start*-to-PP" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="648.59,156.7095,652.59,147.7095,648.59,151.7095,644.59,147.7095,648.59,156.7095" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.396" x="649.59" y="107.5332">CU-09 Registrar pedido</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="82.1768" x="681.6996" y="123.2627">(ocupa cupo)</text></g><!--link PP to PP--><g class="link" data-entity-1="PP" data-entity-2="PP" data-source-line="7" data-uid="lnk4" id="link_PP_PP"><path d="M768.82,178.0895 C789.36,180.0495 803.59,184.8295 803.59,192.4395 C803.59,200.0495 795.3329,204.2595 774.7929,206.2195" fill="none" id="PP-to-PP" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="768.82,206.7895,778.1593,209.9164,773.7974,206.3145,777.3993,201.9526,768.82,206.7895" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="176.3315" x="809.59" y="189.5332">pago rechazado o pendiente</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="129.2637" x="833.1239" y="205.2627">(se puede reintentar)</text></g><!--link PP to C--><g class="link" data-entity-1="PP" data-entity-2="C" data-source-line="8" data-uid="lnk5" id="link_PP_C"><path d="M528.51,205.4995 C466.15,214.6895 389.78,230.6195 325.59,257.9395 C288.98,273.5195 256.8531,296.7492 232.1731,316.9492" fill="none" id="PP-to-C" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="227.53,320.7495,237.0281,318.1445,231.3992,317.5826,231.9611,311.9537,227.53,320.7495" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="186.0562" x="326.59" y="271.5332">CU-15 Mercado Pago aprueba</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="120.0786" x="359.5788" y="287.2627">y el monto coincide</text></g><!--link PP to X--><g class="link" data-entity-1="PP" data-entity-2="X" data-source-line="9" data-uid="lnk6" id="link_PP_X"><path d="M623.9,228.1595 C606.65,253.2495 583.74,288.3295 566.59,320.9395 C540.35,370.8395 552,393.2795 517.59,437.9395 C508.91,449.1995 502.2362,455.7811 490.9662,464.3011" fill="none" id="PP-to-X" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="486.18,467.9195,495.7715,465.6828,490.1685,464.9042,490.9471,459.3012,486.18,467.9195" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="146.0977" x="567.59" y="345.0332">CU-11 el cliente cancela</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="91.6221" x="594.8278" y="360.7627">antes del corte</text></g><!--link PP to X--><g class="link" data-entity-1="PP" data-entity-2="X" data-source-line="10" data-uid="lnk7" id="link_PP_X"><path d="M680.42,228.2695 C711.24,266.4095 749.15,328.3395 718.59,374.9395 C685.31,425.6795 630.9631,453.1525 575.5131,469.9225" fill="none" id="PP-to-X-1" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="569.77,471.6595,579.5426,472.8828,574.5559,470.212,577.2267,465.2254,569.77,471.6595" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="200.6367" x="730.59" y="345.0332">CU-17 vence el plazo para pagar</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="163.2744" x="749.2712" y="360.7627">(30 min o la hora de corte)</text></g><!--link PP to X--><g class="link" data-entity-1="PP" data-entity-2="X" data-source-line="11" data-uid="lnk8" id="link_PP_X"><path d="M768.68,220.0095 C872.4,248.6495 997.22,300.3895 939.59,374.9395 C894.86,432.8095 707.0363,464.867 575.6263,480.807" fill="none" id="PP-to-X-2" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="569.67,481.5295,579.0862,484.4166,574.6336,480.9274,578.1228,476.4748,569.67,481.5295" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="158.0503" x="954.59" y="345.0332">no se pudo crear la orden</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="108.6401" x="979.2951" y="360.7627">en Mercado Pago</text></g><!--link C to X--><g class="link" data-entity-1="C" data-entity-2="X" data-source-line="12" data-uid="lnk9" id="link_C_X"><path d="M122.37,369.6495 C79.3,385.1895 38.4,408.7695 63.59,437.9395 C80.42,457.4195 208.8968,473.1635 313.3768,483.0635" fill="none" id="C-to-X" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="319.35,483.6295,310.7675,478.7983,314.3723,483.1578,310.0128,486.7626,319.35,483.6295" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="241.376" x="64.59" y="418.5332">CU-11 el cliente cancela antes del corte</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="189.5537" x="90.5011" y="434.2627">&#8594; CU-16 se devuelve el dinero</text></g><!--link C to X--><g class="link" data-entity-1="C" data-entity-2="X" data-source-line="13" data-uid="lnk10" id="link_C_X"><path d="M258.01,374.9895 C275.55,383.5695 294.34,393.7995 310.59,404.9395 C328.49,417.2095 329.06,425.1395 346.59,437.9395 C361.31,448.6795 373.0417,456.0658 388.6717,464.8658" fill="none" id="C-to-X-1" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="393.9,467.8095,388.02,459.9085,389.5431,465.3564,384.0951,466.8795,393.9,467.8095" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="157.3711" x="351.5827" y="418.5332">devoluci&#243;n o contracargo</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="165.3564" x="347.59" y="434.2627">avisado por Mercado Pago</text></g><!--link X to X--><g class="link" data-entity-1="X" data-entity-2="X" data-source-line="14" data-uid="lnk11" id="link_X_X"><path d="M569.7,485.1995 C590.36,486.5795 604.59,489.8295 604.59,494.9395 C604.59,500.0495 596.3467,502.8996 575.6867,504.2796" fill="none" id="X-to-X" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="569.7,504.6795,578.9466,508.0707,574.6889,504.3462,578.4134,500.0885,569.7,504.6795" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.4756" x="610.59" y="492.0332">llega un pago aprobado</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="132.4565" x="617.0995" y="507.7627">&#8594; CU-16 se devuelve</text></g><!--link X to *end*--><g class="link" data-entity-1="X" data-entity-2="*end*" data-source-line="15" data-uid="lnk13" id="link_X_*end*"><path d="M332.84,521.9995 C227.43,546.5795 85.5534,579.6574 45.0534,589.0974" fill="none" id="X-to-*end*" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="39.21,590.4595,48.8831,592.312,44.0795,589.3244,47.067,584.5209,39.21,590.4595" style="stroke:#444444;stroke-width:1;"/></g><!--link C to *end*--><g class="link" data-entity-1="C" data-entity-2="*end*" data-source-line="16" data-uid="lnk14" id="link_C_*end*"><path d="M122.54,360.2295 C95.15,368.1895 66.52,381.7695 48.59,404.9395 C6,459.9695 19.0335,546.91 25.1935,577.18" fill="none" id="C-to-*end*" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="26.39,583.0595,28.5149,573.4426,25.3929,578.1599,20.6756,575.0379,26.39,583.0595" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="129.6572" x="23.59" y="492.0332">pasa la hora de corte</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="68.3579" x="54.2397" y="507.7627">(se cocina)</text></g><!--SRC=[XL9hQXin4FxlKqppAovnY2bDINyKDklD0_nOJ19Cwr8cqc0BP6dHmv0Se0VeLNA4tAGdoKXPBqaJw9yLg-yntypeWp92Hqb0FYXj3rNSw5vGGHDKFg2q7XYC1XgIIbhOh_DvI1dimrs2VOG6LmdaxmxgyH48zkfgEhgifbVLhxeudotDVg9-XUxw0EPLUL5yBqOCMYYBQLcD-QU_1-YXhdS-vMnwTZcVP5hhKTJpsMb7BJlcpg8ZTZTWOLJTN5VZgrQqwFtu-1C6WszS2PXuFJWwWJcjb0yENTir-rWH6mJ-S6FCx0IvRqTYZVVSDDitPAGY4uX5dg29n0DofFZ617ITkdokDlmC4t8YQTFm01iNwHQNvWv8myQQO45ONfAIj9CkMkamKOJErK2W4QHPYFoNbiQGTU6Dw0jiYPb9scYyvy3eCBM1ZXD_EeADCjo6HbXR1ZXyjkc_zE4rvTOuj734OsAsTPBCqf1vrK-l_6zY-2Vmqlpz_IUpZrCLITj8Ufi3IsN8lVHaqEeerED3oYnuMWu5kXLl3BVAfnIDTQyJBJgrrhJ2_BRRoTjRJCj-jtwhuzVIra_l9ktVuvjXFQzUMA4Czfy0]--></g></svg>