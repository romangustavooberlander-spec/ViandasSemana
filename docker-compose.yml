# Bases de datos LOCALES para desarrollo y tests (no se usan en producción).
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: viandas
      POSTGRES_PASSWORD: viandas
      POSTGRES_DB: viandas_dev
    ports:
      - "5432:5432"
    volumes:
      - datos_dev:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: viandas
      POSTGRES_PASSWORD: viandas
      POSTGRES_DB: viandas_test
    ports:
      - "5433:5432"

volumes:
  datos_dev:
