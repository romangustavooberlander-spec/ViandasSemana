  <rect x="9" y="21" width="46" height="35" rx="9" fill="#DB2215"/>
  <rect x="18" y="5" width="6" height="14" rx="3" fill="#23201D"/>
  <rect x="40" y="5" width="6" height="14" rx="3" fill="#23201D"/>
  <g fill="#FFFFFF">
    <rect x="15" y="30" width="9" height="9" rx="2.5"/>
    <rect x="27.5" y="30" width="9" height="9" rx="2.5"/>
    <rect x="40" y="30" width="9" height="9" rx="2.5"/>
    <rect x="21.25" y="42" width="9" height="9" rx="2.5"/>
  </g>
  <rect x="33.75" y="42" width="9" height="9" rx="2.5" fill="#FFBF1F"/>
  <path d="M35.8 46.6l1.9 1.9 3.2-3.6" fill="none" stroke="#23201D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
